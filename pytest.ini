[pytest]
# Pytest configuration for Binance Trading Bot

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Minimum version
minversion = 7.0

# Additional options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    -l
    # Enable strict markers
    --strict-markers
    # Coverage report
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    # Warnings
    -W ignore::DeprecationWarning
    # Async support
    --asyncio-mode=auto
    # 防止測試掛死（需 pytest-timeout，見 requirements-dev.txt）
    --timeout=60

# Markers for organizing tests
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints
    slow: Tests that take significant time to run
    requires_db: Tests that require database connection
    requires_redis: Tests that require Redis connection

# Async configuration
asyncio_mode = auto

# Coverage settings
[coverage:run]
source = src
omit =
    */tests/*
    */venv/*
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
