name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-test.txt

      - name: Run test suite
        run: pytest

  secret-scan:
    name: Secret scan guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail on known leaked patterns
        run: |
          # Exclude this workflow file, which intentionally lists the patterns to scan for.
          if git grep -nE "dev_key_12345|shortline\.proxy\.rlwy\.net|binance-trading-bot-production-2bd3|d1xi4u2apm6gef\.cloudfront\.net" -- . ':!.github/workflows/ci.yml'; then
            echo "::error::Potential leaked secret pattern found in the tree"
            exit 1
          fi
          echo "OK: no known leaked secret patterns found"
